name: Compass Manager tests

on:
  workflow_call:
  push:
    branches:
      - main
    paths-ignore:
      - .reuse
      - hack/
      - LICENSES/
      - LICENSE
      - .gitignore
      - "**.md"

  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - .reuse
      - hack/
      - LICENSES/
      - LICENSE
      - .gitignore
      - "**.md"
env:
  COVERFILE: true

jobs:
  unit-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Set up go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: Run unit tests
        run: |
          set -o pipefail
          make test | tee test-output.txt
      - name: filter out coverage
        run: |
          #!/bin/bash

          filters=(
              "github.com/kyma-project/compass-manager/api"
              "mock"
              "test"
          )

          input="coverage.txt"
          output="coverage-filtered.txt"

          cp "$input" "$output"

          for i in "${filters[@]}"; do
            echo "filtering $i"
            cp "$output" "$output~"
            grep --invert-match $i "$output~" > "$output"
            wc -l $output
          done
          rm "$output~"

      - name: coveralls github action
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          format: golang
          file: ./coverage-filtered.txt
          fail-on-error: false
      - name: Upload test logs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success() || failure()
        with:
          name: test-output
          path: test-output.txt
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success() || failure()
        with:
          name: "code-coverage"
          path: "coverage.txt"

  summary:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: success() || failure()
    steps:
      - name: "Download test log"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: ${{ env.unit-test-log }}
      - name: "Generate summary"
        run: |
          {
            echo '# Compass Manager'
            # if test log exists
            if [ -f ${{ env.unit-test-log }} ]; then
              echo '## Unit Tests'
              printf '\n<details>\n<summary>click to expand logs</summary>\n'
              printf '\n```\n'
              cat ${{ env.unit-test-log }}
              printf '\n```\n</details>\n'
            fi
          } >> $GITHUB_STEP_SUMMARY
